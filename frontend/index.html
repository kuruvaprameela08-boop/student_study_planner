<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Study Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Study Planner</h1>
        <p>Organize your studies and manage your tasks</p>
    </header>

    <main>

        <!-- Dashboard -->

        <section class="dashboard">

            <div class="card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>

            <div class="card">
                <h3>Pending</h3>
                <p id="pendingTasks">0</p>
            </div>

        </section>


        <!-- Add Task -->

        <section class="task-form">

            <h2>Add New Task</h2>

            <form id="taskForm">

                <input
                    type="text"
                    id="title"
                    placeholder="Task title"
                    required
                >

                <input
                    type="text"
                    id="subject"
                    placeholder="Subject"
                    required
                >

                <input
                    type="date"
                    id="deadline"
                    required
                >

                <select id="priority">

                    <option value="High">High</option>

                    <option value="Medium">Medium</option>

                    <option value="Low">Low</option>

                </select>

                <button type="submit">
                    Add Task
                </button>

            </form>

        </section>


        <!-- Task List -->

        <section class="task-section">

            <h2>My Tasks</h2>

            <table>

                <thead>

                    <tr>

                        <th>Title</th>

                        <th>Subject</th>

                        <th>Deadline</th>

                        <th>Priority</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="taskTable">

                </tbody>

            </table>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
